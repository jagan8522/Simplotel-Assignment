name: Client Changelog Automation

on:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Generate client changelog
        run: |
          TAG="${{ github.event.release.tag_name }}"
          BODY="${{ github.event.release.body }}"

          echo "" >> CHANGELOG.md
          echo "## ✨ $TAG – What’s New" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 🚀 Updates" >> CHANGELOG.md

          # 🔑 Extract PR titles from ALL GitHub release formats
          PR_TITLES=$(echo "$BODY" \
            | grep -E "(#|pull/)[0-9]+" \
            | sed 's/^[-* ]*//' \
            | sed 's/ by @.*//' \
            | sed 's/ in #.*//' \
            | sed 's| in https://github.com.*||' \
            | sed 's/ *(#.*)//')

          COUNT=1
          if [ -n "$PR_TITLES" ]; then
            while IFS= read -r line; do
              echo "$COUNT) $line" >> CHANGELOG.md
              COUNT=$((COUNT + 1))
            done <<< "$PR_TITLES"
          else
            echo "1) Minor internal improvements" >> CHANGELOG.md
          fi

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog for clients (${{ github.event.release.tag_name }})" || echo "No changes"
          git push origin ${{ github.event.release.target_commitish }}



