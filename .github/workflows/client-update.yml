name: Client Changelog Automation

on:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Generate client changelog
        run: |
          TAG="${{ github.event.release.tag_name }}"
          BODY="${{ github.event.release.body }}"

          echo "" >> CHANGELOG.md
          echo "## ✨ $TAG – What’s New" >> CHANGELOG.md

          # -------- FEATURES (enhancement) --------
          FEATURES=$(echo "$BODY" | sed -n '/Features/,/###/p' \
            | grep -E '^[*-] ' \
            | sed 's/^[*-] //' \
            | sed 's/ by @.*//' \
            | sed 's| in https://github.com.*||')

          if [ -n "$FEATURES" ]; then
            echo "" >> CHANGELOG.md
            echo "### 🚀 New Features" >> CHANGELOG.md
            COUNT=1
            while IFS= read -r line; do
              echo "$COUNT) $line" >> CHANGELOG.md
              COUNT=$((COUNT+1))
            done <<< "$FEATURES"
          fi

          # -------- DOCUMENTATION --------
          DOCS=$(echo "$BODY" | sed -n '/Documentation/,/###/p' \
            | grep -E '^[*-] ' \
            | sed 's/^[*-] //' \
            | sed 's/ by @.*//' \
            | sed 's| in https://github.com.*||')

          if [ -n "$DOCS" ]; then
            echo "" >> CHANGELOG.md
            echo "### 📄 Documentation" >> CHANGELOG.md
            COUNT=1
            while IFS= read -r line; do
              echo "$COUNT) $line" >> CHANGELOG.md
              COUNT=$((COUNT+1))
            done <<< "$DOCS"
          fi

          # -------- BUG FIXES --------
          BUGS=$(echo "$BODY" | sed -n '/Bug Fixes/,/###/p' \
            | grep -E '^[*-] ' \
            | sed 's/^[*-] //' \
            | sed 's/ by @.*//' \
            | sed 's| in https://github.com.*||')

          if [ -n "$BUGS" ]; then
            echo "" >> CHANGELOG.md
            echo "### 🐛 Bug Fixes" >> CHANGELOG.md
            COUNT=1
            while IFS= read -r line; do
              echo "$COUNT) $line" >> CHANGELOG.md
              COUNT=$((COUNT+1))
            done <<< "$BUGS"
          fi

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog for clients (${{ github.event.release.tag_name }})" || echo "No changes"
          git push origin ${{ github.event.release.target_commitish }}


